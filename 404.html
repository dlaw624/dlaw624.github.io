      --fg: #eaeaea;

    main {

    .back {
      display: inline-block;
      margin-top: 2.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover {
      opacity: 0.7;
    }
